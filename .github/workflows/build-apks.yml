name: Build the two APKs

# Builds one APK per app and hands both out as a single download.
# Actions -> Build the two APKs -> Run workflow, then download the lean-tv-apks artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apks:
    name: APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Unpack the source if it ships as a zip
        run: |
          if [ -f lean-tv-source.zip ] && { [ ! -f launcher/app/build.gradle ] || [ ! -f phone/app/build.gradle ]; }; then
            unzip -q -o lean-tv-source.zip
            echo "unpacked lean-tv-source.zip"
          fi

      - name: Which apps are in this repository
        id: src
        run: |
          echo "launcher=$([ -f launcher/app/build.gradle ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "phone=$([ -f phone/app/build.gradle ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: JDK 17
        if: steps.src.outputs.launcher == '1' || steps.src.outputs.phone == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android platform 34 and build-tools 34.0.0
        if: steps.src.outputs.launcher == '1' || steps.src.outputs.phone == '1'
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then MANAGER="$(command -v sdkmanager)"; fi
          echo "using SDK $SDK"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          yes | "$MANAGER" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Lean TV launcher (TV)
        if: steps.src.outputs.launcher == '1'
        run: cd launcher && sh ./gradlew --no-daemon assembleRelease

      - name: Lean TV Remote (phone)
        if: steps.src.outputs.phone == '1'
        run: cd phone && sh ./gradlew --no-daemon assembleRelease

      - name: Hand out the APKs
        if: steps.src.outputs.launcher == '1' || steps.src.outputs.phone == '1'
        uses: actions/upload-artifact@v4
        with:
          name: lean-tv-apks
          if-no-files-found: warn
          path: |
            launcher/app/build/outputs/apk/release/app-release.apk
            phone/app/build/outputs/apk/release/app-release.apk
