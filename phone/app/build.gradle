plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.leantv.remote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.leantv.remote'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded, never published: the debug key installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only: the Adb message framing and the public key struct, on a plain JVM.
    testImplementation 'junit:junit:4.13.2'
}
